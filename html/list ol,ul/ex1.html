<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-
width, initial-scale=1.0">

<title>Document</title>
<style>
ul {
list-style: none;
display: flex;
flex-direction: row;
}
li::before {
content: " 👉 ";
padding-left: 5px;
padding-right: 5px;
}
li:first-child::before {
content: " ";
}
</style>
</head>
<body>
<ul>
<li>Home</li>
<li>Electronics</li>
<li>Mobiles & Accessories</li>
<li>Apple Mobiles</li>
<li>iPhone</li>
<li>iPhone 17 Back</li>
</ul>
</body>
</html>
