<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Bootstrap</title>
<link rel="stylesheet"

href="../node_modules/bootstrap-
icons/font/bootstrap-icons.css">

<style>
header {
background-color: #880fc5;
color:white;
padding: 15px;
font-family: Arial;
font-size: 20px;
display: flex;
flex-direction: row;
justify-content: space-between;
align-items: center;
}
.search-bar {
display: flex;
width: 300px;
border:1px solid #660297;

padding: 10px;
font-size: 16px;
background-color: #470269;
justify-content: space-between;
align-items: center;
}
 .btn-cmd { 
background-color: black;
padding: 5px;
border-radius: 5px;
}
.k {
font-size: 12px;
}
nav span {
margin-right: 20px;
}
aside span {
margin-right: 10px;
}
.shortcuts {
display: flex;
flex-direction: row;
}
.shortcuts span {
margin-right: 15px;
}
</style>
</head>

<body>
<header>
<div>
<nav>
<span class="bi bi-bootstrap-fill">

</span>

<span>Docs</span>
<span>Examples</span>
<span>Icons</span>
<span>Blog</span>
</nav>
</div>
<div>
<div class="search-bar">
<span class="bi bi-search">

Search</span>

<div class="btn-cmd">
<span class="bi bi-command">

</span>

<span class="k">K</span>
</div>
</div>
</div>
<div class="shortcuts">
<aside>
<span class="bi bi-github"></span>
<span class="bi bi-twitter-x"></span>
<span class="bi bi-opencollective">

</span>

</aside>
<span>|</span>
<span>v5.3</span>
<span>|</span>
<span class="bi bi-sun-fill"></span>
<span class="bi bi-chevron-down">

</span>
</div>
</header>
</body>
</html>
